[platformio]
default_envs = f103c8

[env]
extra_scripts = pre:portable_sources.py
build_flags = -std=gnu11 -Wall -Wextra

[env:f103c8]
platform = ststm32@17.6.0
platform_packages =
    platformio/framework-libopencm3@1.10000.260625
    platformio/toolchain-gccarmnoneeabi@1.70201.0
board = bluepill_f103c8
framework = libopencm3
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<main.c> +<ports/libopencm3/> +<boards/f103c8/>
